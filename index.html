<!DOCTYPE html>
<html lang="am">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 12 Automatic Timetable</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,"Noto Sans Ethiopic",sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.container{
    max-width:1400px;
    margin:auto;
}

header{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
}

header p{
    margin:0;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
}

.settings,
.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

button{
    border:none;
    padding:11px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    margin:5px;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-warning{
    background:#d97706;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-secondary{
    background:#6b7280;
    color:white;
}

button:hover{
    opacity:.88;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:15px;
}

.message{
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    display:none;
    font-weight:bold;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.message.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
}

.assignment-table,
.code-table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

.assignment-table th,
.assignment-table td,
.code-table th,
.code-table td{
    border:1px solid #d1d5db;
    padding:10px;
    text-align:center;
}

.assignment-table th,
.code-table th{
    background:#eff6ff;
}

.code{
    font-weight:bold;
    color:#1d4ed8;
}

.timetable-wrapper{
    overflow-x:auto;
}

.timetable{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
    margin-bottom:20px;
}

.timetable th,
.timetable td{
    border:1px solid #9ca3af;
    padding:6px;
    text-align:center;
    vertical-align:middle;
}

.timetable th{
    background:#1d4ed8;
    color:white;
}

.period-cell{
    background:#f3f4f6;
    font-weight:bold;
    min-width:65px;
}

.lesson{
    background:#eff6ff;
    border-radius:5px;
    padding:4px;
    min-height:45px;
}

.subject{
    font-weight:bold;
    color:#1d4ed8;
    font-size:13px;
}

.teacher{
    margin-top:2px;
    font-size:10px;
    color:#374151;
}

.teacher-code{
    font-weight:bold;
    color:#111827;
}

.free{
    color:#9ca3af;
    font-style:italic;
    font-size:11px;
}

.loading{
    text-align:center;
    padding:30px;
    font-weight:bold;
    color:#2563eb;
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .card{
        padding:12px;
    }

    button{
        width:100%;
        margin:4px 0;
    }

}

@media print{

    @page{
        size:A4 portrait;
        margin:8mm 8mm 7mm 8mm;
    }

    html,
    body{

        width:100% !important;
        height:100% !important;
        margin:0 !important;
        padding:0 !important;
        background:white !important;
        overflow:hidden !important;
    }

    .no-print,
    header{
        display:none !important;
    }

    #resultCard{

        display:block !important;
        width:100% !important;
        margin:0 !important;
        padding:0 !important;
        border:none !important;
        box-shadow:none !important;
        background:white !important;
    }

    #result{

        width:100% !important;
        margin:0 !important;
        padding:0 !important;
    }

    .print-one-page{

        width:100% !important;
        height:auto !important;
        max-height:100% !important;
        margin:0 !important;
        padding:0 !important;
        overflow:hidden !important;

        page-break-before:avoid !important;
        page-break-after:avoid !important;
        page-break-inside:avoid !important;

        break-before:avoid !important;
        break-after:avoid !important;
        break-inside:avoid !important;
    }

    .pdf-header{

        display:flex !important;
        justify-content:space-between !important;
        align-items:flex-start !important;
        width:100% !important;
        margin:0 0 8px 0 !important;
        padding:0 !important;
    }

    .pdf-new{

        font-family:
            Georgia,
            "Times New Roman",
            serif !important;

        font-size:18px !important;
        font-weight:bold !important;
        font-style:italic !important;
        text-decoration:underline !important;
        line-height:20px !important;
    }

    .pdf-date{

        font-family:
            Georgia,
            "Times New Roman",
            serif !important;

        font-size:10px !important;
        font-weight:bold !important;
        line-height:14px !important;
    }

    .pdf-title{

        display:block !important;
        text-align:center !important;

        font-family:
            Georgia,
            "Times New Roman",
            serif !important;

        font-size:14px !important;
        font-weight:bold !important;
        line-height:18px !important;

        margin:0 0 7px 0 !important;
        padding:0 !important;
    }

    .pdf-subtitle{
        display:none !important;
    }

    .timetable-wrapper{

        width:100% !important;
        overflow:visible !important;
        margin:0 !important;
        padding:0 !important;
    }

    .timetable{

        width:100% !important;
        min-width:0 !important;
        max-width:100% !important;

        table-layout:fixed !important;
        border-collapse:collapse !important;
        border-spacing:0 !important;

        margin:0 auto !important;
        padding:0 !important;

        page-break-inside:avoid !important;
        break-inside:avoid !important;
    }

    .timetable col.day-column{
        width:8% !important;
    }

    .timetable col.period-column{
        width:11% !important;
    }

    .timetable col.class-column{
        width:20.25% !important;
    }

    .timetable thead tr:first-child{
        height:18px !important;
    }

    .timetable thead tr:nth-child(2){
        height:17px !important;
    }

    .timetable thead th{

        height:18px !important;
        min-height:18px !important;
        max-height:18px !important;

        padding:1px !important;

        border:0.6px solid #555 !important;

        font-family:
            Georgia,
            "Times New Roman",
            serif !important;

        font-size:8px !important;
        line-height:9px !important;
        font-weight:bold !important;

        background:white !important;
        color:#111 !important;

        vertical-align:middle !important;
        overflow:hidden !important;
    }

    .timetable thead tr:nth-child(2) th{

        height:17px !important;
        min-height:17px !important;
        max-height:17px !important;

        font-size:7px !important;
        line-height:8px !important;
    }

    .timetable tbody tr{

        height:16px !important;
        min-height:16px !important;
        max-height:16px !important;
    }

    .timetable tbody td{

        height:16px !important;
        min-height:16px !important;
        max-height:16px !important;

        padding:0 !important;
        margin:0 !important;

        border:0.6px solid #555 !important;

        text-align:center !important;
        vertical-align:middle !important;

        line-height:1 !important;
        overflow:hidden !important;
    }

    .day-cell{

        width:8% !important;
        min-width:8% !important;
        max-width:8% !important;

        padding:0 !important;

        font-family:
            Georgia,
            "Times New Roman",
            serif !important;

        font-size:8px !important;
        font-weight:bold !important;
        line-height:1 !important;

        writing-mode:vertical-rl !important;
        transform:rotate(180deg) !important;

        white-space:nowrap !important;
        overflow:hidden !important;
    }

    .period-cell{

        width:11% !important;
        min-width:11% !important;
        max-width:11% !important;

        padding:0 2px !important;

        background:white !important;

        font-family:
            Georgia,
            "Times New Roman",
            serif !important;

        font-size:7px !important;
        font-weight:bold !important;
        line-height:1 !important;

        white-space:nowrap !important;
        overflow:hidden !important;
    }

    .lesson{

        display:block !important;

        width:100% !important;
        height:15px !important;
        min-height:15px !important;
        max-height:15px !important;

        padding:0 !important;
        margin:0 !important;

        border-radius:0 !important;
        background:white !important;

        overflow:hidden !important;
    }

    .subject{

        display:block !important;

        width:100% !important;
        height:8px !important;
        max-height:8px !important;

        margin:0 !important;
        padding:0 !important;

        font-family:
            Georgia,
            "Times New Roman",
            serif !important;

        font-size:7px !important;
        font-weight:bold !important;
        color:#111 !important;
        line-height:8px !important;

        white-space:nowrap !important;
        overflow:hidden !important;
        text-overflow:clip !important;
    }

    .teacher{

        display:block !important;

        width:100% !important;
        height:6px !important;
        max-height:6px !important;

        margin:0 !important;
        padding:0 !important;

        font-family:
            Georgia,
            "Times New Roman",
            serif !important;

        font-size:5px !important;
        color:#111 !important;
        line-height:6px !important;

        white-space:nowrap !important;
        overflow:hidden !important;
    }

    .teacher-code{

        font-size:5px !important;
        font-weight:bold !important;
        color:#111 !important;
    }

    .free{

        font-family:
            Georgia,
            "Times New Roman",
            serif !important;

        font-size:5px !important;
        color:#777 !important;
        line-height:16px !important;
    }

    table,
    tr,
    td,
    th{

        page-break-inside:avoid !important;
        break-inside:avoid !important;
    }

    .pdf-footer{

        display:block !important;
        text-align:center !important;

        font-family:
            Georgia,
            "Times New Roman",
            serif !important;

        font-size:7px !important;

        margin-top:7px !important;
        line-height:9px !important;
    }

}

.pdf-header,
.pdf-title,
.pdf-footer,
.pdf-subtitle{
    display:none;
}

</style>

</head>

<body>

<div class="container">

<header class="no-print">

    <h1>
        📚 Grade 12 Automatic Timetable
    </h1>

    <p>
        prepared by Mesud
    </p>        
</header>

<div
    id="message"
    class="message no-print">
</div>

<div class="card no-print">

    <h2>
        ⚙️ Timetable Settings
    </h2>

    <div class="settings">

        <div>

            <label>
                Classes
            </label>

            <input
                id="classNames"
                value="12A,12B,12C,12D"
            >

        </div>

        <div>

            <label>
                Days
            </label>

            <input
                id="daysCount"
                type="number"
                value="5"
                min="5"
                max="5"
            >

        </div>

        <div>

            <label>
                Periods per Day
            </label>

            <input
                id="periodCount"
                type="number"
                value="5"
                min="5"
                max="5"
            >

        </div>

    </div>

</div>

<!-- TEACHER CODES -->

<div class="card no-print">

    <h2>
        👨‍🏫 Teacher Codes
    </h2>

    <div style="overflow-x:auto;">

        <table class="code-table">

            <thead>

                <tr>

                    <th>No</th>

                    <th>Teacher Name</th>

                    <th>Code</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="teacherCodeBody">
            </tbody>

        </table>

    </div>

    <div class="actions">

        <button
            type="button"
            class="btn-warning"
            onclick="printTeacherCodes()"
        >
            🖨️ Print Teacher Codes
        </button>

    </div>

</div>

<!-- ADD / EDIT SUBJECT -->

<div class="card no-print">

    <h2>
        ➕ Add / Edit Subject
    </h2>

    <div class="form-grid">

        <div>

            <label>Subject</label>

            <input
                id="subject"
                placeholder="Example: Mathematics"
            >

        </div>

        <div>

            <label>Teacher</label>

            <input
                id="teacher"
                placeholder="Teacher name"
            >

        </div>

        <div>

            <label>Class</label>

            <select id="classSelect">
            </select>

        </div>

        <div>

            <label>Periods / Week</label>

            <input
                id="periods"
                type="number"
                min="1"
                max="5"
                value="3"
            >

        </div>

    </div>

    <div class="actions">

        <button
            type="button"
            class="btn-primary"
            onclick="saveAssignment()"
            id="saveBtn"
        >
            ➕ Add Subject
        </button>

        <button
            type="button"
            class="btn-secondary"
            onclick="resetForm()"
        >
            ↩️ Reset
        </button>

    </div>

</div>

<!-- ASSIGNMENTS -->

<div class="card no-print">

    <h2>
        📋 Subject Assignments
    </h2>

    <div style="overflow-x:auto;">

        <table class="assignment-table">

            <thead>

                <tr>

                    <th>No</th>
                    <th>Subject</th>
                    <th>Teacher</th>
                    <th>Class</th>
                    <th>Periods</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="assignmentBody">
            </tbody>

        </table>

    </div>

    <div class="actions">

        <button
            type="button"
            class="btn-success"
            onclick="loadDefaultData()"
        >
            📚 Load Default Grade 12 Data
        </button>

        <button
            type="button"
            class="btn-danger"
            onclick="clearAssignments()"
        >
            🗑️ Clear All
        </button>

    </div>

</div>

<!-- GENERATE -->

<div class="card no-print">

    <h2>
        🚀 Generate
    </h2>

    <div class="actions">

        <button
            type="button"
            class="btn-primary"
            onclick="generateTimetable()"
        >
            ⚡ Generate Timetable
        </button>

        <button
            type="button"
            class="btn-success"
            onclick="exportExcel()"
        >
            📊 Export Excel
        </button>

        <button
            type="button"
            class="btn-warning"
            onclick="exportPDF()"
        >
            📄 Export PDF
        </button>

    </div>

</div>

<!-- RESULT -->

<div
    class="card"
    id="resultCard"
>

    <div id="result">

        <div class="loading">

            Generate Timetable ን ለመጀመር
            "Generate Timetable" ይጫኑ።

        </div>

    </div>

</div>

</div>

<script>

/* =========================================================
   VARIABLES
   ========================================================= */

let classes=[
    "12A",
    "12B",
    "12C",
    "12D"
];

let days=[
    "ሰኞ",
    "ማክሰኞ",
    "ረቡዕ",
    "ሐሙስ",
    "ዓርብ"
];

let assignments=[];

let timetable=null;

let editingIndex=-1;


/* =========================================================
   TEACHER CODES
   ========================================================= */

const teacherCodes={

    "Mohammed Frew":"Maths1",
    "Salim":"Eco1",
    "Mohammed Seid":"Maths2",
    "Tekle":"En1",
    "Mohammed Yesuf":"En2",
    "Tirunesh":"Am1",
    "Seid Yesuf":"It1",
    "Alemesged":"Phy1",
    "Chane":"Che1",
    "Ahmed":"Bio1",
    "Yimam":"AG1",
    "Alemu":"Geo1",
    "Abubeker":"His1"

};


/* =========================================================
   GET TEACHER CODE
   ========================================================= */

function getTeacherCode(teacher){

    const name =
        String(teacher).trim();

    if(
        teacherCodes[name]
    ){

        return teacherCodes[name];

    }

    let number=1;

    let code="T1";

    while(
        Object.values(
            teacherCodes
        ).includes(code)
    ){

        number++;

        code="T"+number;

    }

    teacherCodes[name]=code;

    renderTeacherCodes();

    return code;
}


/* =========================================================
   RENDER TEACHER CODES
   ========================================================= */

function renderTeacherCodes(){

    const body =
        document.getElementById(
            "teacherCodeBody"
        );

    if(!body){
        return;
    }

    body.innerHTML="";

    Object.entries(
        teacherCodes
    ).forEach(
        ([name,code],index)=>{

            const tr =
                document.createElement(
                    "tr"
                );

            const noTd =
                document.createElement(
                    "td"
                );

            noTd.textContent =
                index+1;

            const nameTd =
                document.createElement(
                    "td"
                );

            nameTd.textContent =
                name;

            const codeTd =
                document.createElement(
                    "td"
                );

            codeTd.className="code";

            codeTd.textContent =
                code;

            const actionTd =
                document.createElement(
                    "td"
                );

            const editBtn =
                document.createElement(
                    "button"
                );

            editBtn.type="button";

            editBtn.className=
                "btn-primary";

            editBtn.textContent=
                "✏️ Edit";

            editBtn.onclick=()=>{
                editTeacherCode(index);
            };

            actionTd.appendChild(
                editBtn
            );

            tr.appendChild(noTd);
            tr.appendChild(nameTd);
            tr.appendChild(codeTd);
            tr.appendChild(actionTd);

            body.appendChild(tr);

        }
    );
}


/* =========================================================
   EDIT TEACHER NAME + CODE
   ========================================================= */

function editTeacherCode(index){

    const entries =
        Object.entries(
            teacherCodes
        );

    if(
        index<0 ||
        index>=entries.length
    ){

        return;

    }

    const oldName =
        entries[index][0];

    const oldCode =
        entries[index][1];


    /* ============================
       EDIT NAME
       ============================ */

    const newNameInput =
        prompt(
            "Teacher Name ያስተካክሉ:",
            oldName
        );

    if(
        newNameInput===null
    ){

        return;

    }

    const newName =
        newNameInput.trim();

    if(!newName){

        alert(
            "Teacher Name ባዶ መሆን አይችልም።"
        );

        return;

    }


    /* ============================
       EDIT CODE
       ============================ */

    const newCodeInput =
        prompt(
            "Teacher Code ያስተካክሉ:",
            oldCode
        );

    if(
        newCodeInput===null
    ){

        return;

    }

    const newCode =
        newCodeInput.trim();

    if(!newCode){

        alert(
            "Teacher Code ባዶ መሆን አይችልም።"
        );

        return;

    }


    /* ============================
       DUPLICATE NAME CHECK
       ============================ */

    if(
        newName!==oldName &&
        Object.prototype.hasOwnProperty.call(
            teacherCodes,
            newName
        )
    ){

        alert(
            "ይህ Teacher Name ቀድሞ አለ።"
        );

        return;

    }


    /* ============================
       DUPLICATE CODE CHECK
       ============================ */

    const duplicateCode =
        Object.entries(
            teacherCodes
        ).some(
            ([name,code])=>
                name!==oldName &&
                code===newCode
        );

    if(duplicateCode){

        alert(
            "ይህ Teacher Code ቀድሞ አለ።"
        );

        return;

    }


    /* =================================================
       MOST IMPORTANT PART
       OLD NAME → NEW NAME
       ALL ASSIGNMENTS
       ================================================= */

    assignments.forEach(
        assignment=>{

            if(
                assignment.teacher===
                oldName
            ){

                assignment.teacher=
                    newName;

            }

        }
    );


    /* =================================================
       UPDATE TEACHER CODES
       KEEP SAME TABLE POSITION
       ================================================= */

    const updatedCodes={};

    Object.entries(
        teacherCodes
    ).forEach(
        ([name,code])=>{

            if(
                name===oldName
            ){

                updatedCodes[
                    newName
                ]=newCode;

            }
            else{

                updatedCodes[
                    name
                ]=code;

            }

        }
    );


    Object.keys(
        teacherCodes
    ).forEach(
        key=>{

            delete teacherCodes[key];

        }
    );


    Object.assign(
        teacherCodes,
        updatedCodes
    );


    /* =================================================
       UPDATE EXISTING TIMETABLE
       ================================================= */

    if(timetable){

        Object.keys(
            timetable
        ).forEach(
            className=>{

                for(
                    let d=0;
                    d<5;
                    d++
                ){

                    for(
                        let p=0;
                        p<5;
                        p++
                    ){

                        const lesson =
                            timetable[
                                className
                            ][d][p];

                        if(
                            lesson &&
                            lesson.teacher===
                            oldName
                        ){

                            lesson.teacher=
                                newName;

                        }

                    }

                }

            }
        );

    }


    /* =================================================
       REFRESH
       ================================================= */

    renderTeacherCodes();

    renderAssignments();


    if(timetable){

        displayTimetable();

    }


    showMessage(

        );

/* =========================================================
   GENERATE
   ========================================================= */

function generateTimetable(){

    updateClasses();


    const dayCount =
        Number(
            document.getElementById(
                "daysCount"
            ).value
        );


    const periodCount =
        Number(
            document.getElementById(
                "periodCount"
            ).value
        );


    if(
        dayCount!==5 ||
        periodCount!==5
    ){

        showMessage(
            "❌ 5 days × 5 periods ብቻ ይፈቀዳል።",
            "error"
        );

        return;

    }


    if(
        assignments.length===0
    ){

        showMessage(
            "❌ መጀመሪያ assignments ያስገቡ።",
            "error"
        );

        return;

    }


    for(
        const cls of classes
    ){

        const total =
            assignments
            .filter(
                a=>
                    a.className===cls
            )
            .reduce(
                (sum,a)=>
                    sum+
                    Number(a.periods),
                0
            );


        if(total!==25){

            showMessage(
                `❌ ${cls} = ${total} periods ነው። 25 periods መሆን አለበት።`,
                "error"
            );

            return;

        }

    }


    showMessage(
        "⏳ Timetable እየተሰራ ነው...",
        "info"
    );


    setTimeout(
        ()=>{

            const solved =
                solveTimetable(
                    assignments
                );


            if(!solved){

                showMessage(
                    "❌ ሁሉንም ህጎች የሚያሟላ timetable ማግኘት አልተቻለም።",
                    "error"
                );

                return;

            }


            timetable =
                solved;


            displayTimetable();


            showMessage(
                "✅ Timetable ተሰርቷል።",
                "success"
            );

        },
        50
    );

}


/* =========================================================
   SOLVER
   ========================================================= */

function solveTimetable(assignments){

    const dayCount=5;

    const periodCount=5;

    const table={};


    classes.forEach(
        cls=>{

            table[cls]=[];


            for(
                let d=0;
                d<dayCount;
                d++
            ){

                table[cls][d]=[];


                for(
                    let p=0;
                    p<periodCount;
                    p++
                ){

                    table[
                        cls
                    ][d][p]=null;

                }

            }

        }
    );


    const groups=[];


    assignments.forEach(
        (a,index)=>{

            groups.push({

                id:index,

                subject:
                    a.subject,

                teacher:
                    a.teacher,

                className:
                    a.className,

                total:
                    Number(a.periods),

                placed:0,

                usedDays:
                    new Set()

            });

        }
    );


    const teacherBusy={};

    const teacherDays={};

    const teacherLoadByDay={};


    assignments.forEach(
        a=>{

            if(
                !teacherBusy[a.teacher]
            ){

                teacherBusy[
                    a.teacher
                ]={};

            }


            if(
                !teacherDays[a.teacher]
            ){

                teacherDays[
                    a.teacher
                ]=new Set();

            }


            if(
                !teacherLoadByDay[
                    a.teacher
                ]
            ){

                teacherLoadByDay[
                    a.teacher
                ]={};

            }

        }
    );


    function candidateSlots(group){

        const result=[];

        const teacher=
            group.teacher;


        for(
            let d=0;
            d<dayCount;
            d++
        ){

            if(
                group.usedDays.has(d)
            ){

                continue;

            }


            /*
             * TEACHER MAXIMUM 4 WORKING DAYS
             */

            if(
                teacherDays[
                    teacher
                ].size>=4 &&
                !teacherDays[
                    teacher
                ].has(d)
            ){

                continue;

            }


            for(
                let p=0;
                p<periodCount;
                p++
            ){

                if(
                    table[
                        group.className
                    ][d][p]!==null
                ){

                    continue;

                }


                if(
                    teacherBusy[
                        teacher
                    ][d+"-"+p]
                ){

                    continue;

                }


                result.push({
                    d,
                    p
                });

            }

        }


        return result;

    }


    function chooseGroup(){

        let best=null;

        let bestCandidates=null;


        for(
            const group of groups
        ){

            if(
                group.placed>=group.total
            ){

                continue;

            }


            const candidates =
                candidateSlots(
                    group
                );


            if(
                candidates.length===0
            ){

                return{

                    group,

                    candidates:[]

                };

            }


            if(
                best===null ||
                candidates.length<
                bestCandidates.length
            ){

                best=
                    group;

                bestCandidates=
                    candidates;

            }

        }


        return{

            group:best,

            candidates:
                bestCandidates

        };

    }


    function place(
        group,
        slot
    ){

        const d=slot.d;

        const p=slot.p;

        const teacher=
            group.teacher;


        table[
            group.className
        ][d][p]={

            subject:
                group.subject,

            teacher:
                group.teacher

        };


        teacherBusy[
            teacher
        ][d+"-"+p]=true;


        if(
            !teacherLoadByDay[
                teacher
            ][d]
        ){

            teacherLoadByDay[
                teacher
            ][d]=0;

        }


        teacherLoadByDay[
            teacher
        ][d]++;


        teacherDays[
            teacher
        ].add(d);


        group.usedDays.add(d);

        group.placed++;

    }


    function remove(
        group,
        slot
    ){

        const d=slot.d;

        const p=slot.p;

        const teacher=
            group.teacher;


        table[
            group.className
        ][d][p]=null;


        delete teacherBusy[
            teacher
        ][d+"-"+p];


        teacherLoadByDay[
            teacher
        ][d]--;


        if(
            teacherLoadByDay[
                teacher
            ][d]<=0
        ){

            delete teacherLoadByDay[
                teacher
            ][d];

        }


        let stillThere=false;


        for(
            let pp=0;
            pp<periodCount;
            pp++
        ){

            if(
                teacherBusy[
                    teacher
                ][d+"-"+pp]
            ){

                stillThere=true;

                break;

            }

        }


        if(!stillThere){

            teacherDays[
                teacher
            ].delete(d);

        }


        group.usedDays.delete(d);

        group.placed--;

    }


    let nodes=0;

    const MAX_NODES=3000000;


    function search(){

        nodes++;


        if(
            nodes>MAX_NODES
        ){

            return false;

        }


        let complete=true;


        for(
            const g of groups
        ){

            if(
                g.placed<g.total
            ){

                complete=false;

                break;

            }

        }


        if(complete){

            return true;

        }


        const choice=
            chooseGroup();


        const group=
            choice.group;

        const candidates=
            choice.candidates;


        if(
            !group ||
            candidates.length===0
        ){

            return false;

        }


        candidates.sort(
            (a,b)=>{

                let scoreA=0;

                let scoreB=0;


                const teacher=
                    group.teacher;


                if(
                    teacherDays[
                        teacher
                    ].has(a.d)
                ){

                    scoreA+=100;

                }


                if(
                    teacherDays[
                        teacher
                    ].has(b.d)
                ){

                    scoreB+=100;

                }


                scoreA -=
                    teacherLoadByDay[
                        teacher
                    ][a.d]||0;


                scoreB -=
                    teacherLoadByDay[
                        teacher
                    ][b.d]||0;


                scoreA-=a.p*.1;

                scoreB-=b.p*.1;


                return scoreB-scoreA;

            }
        );


        for(
            const slot of candidates
        ){

            place(
                group,
                slot
            );


            let possible=true;


            for(
                const g of groups
            ){

                if(
                    g.placed>=g.total
                ){

                    continue;

                }


                const c=
                    candidateSlots(g);


                if(
                    c.length===0
                ){

                    possible=false;

                    break;

                }

            }


            if(
                possible &&
                search()
            ){

                return true;

            }


            remove(
                group,
                slot
            );

        }


        return false;

    }


    const success =
        search();


    if(!success){

        return null;

    }


    if(
        !validateTimetable(
            table,
            assignments
        )
    ){

        return null;

    }


    return table;

}


/* =========================================================
   VALIDATE
   ========================================================= */

function validateTimetable(
    table,
    data
){

    const teacherSlots={};

    const teacherDaySets={};


    for(
        const cls of classes
    ){

        const classData =
            data.filter(
                a=>
                    a.className===cls
            );


        const subjectDays={};


        for(
            let d=0;
            d<5;
            d++
        ){

            for(
                let p=0;
                p<5;
                p++
            ){

                const lesson =
                    table[
                        cls
                    ][d][p];


                if(!lesson){

                    continue;

                }


                const key =
                    lesson.teacher+
                    "|"+
                    d+
                    "|"+
                    p;


                if(
                    teacherSlots[key]
                ){

                    return false;

                }


                teacherSlots[key]=true;


                if(
                    !teacherDaySets[
                        lesson.teacher
                    ]
                ){

                    teacherDaySets[
                        lesson.teacher
                    ]=new Set();

                }


                teacherDaySets[
                    lesson.teacher
                ].add(d);


                if(
                    !subjectDays[
                        lesson.subject
                    ]
                ){

                    subjectDays[
                        lesson.subject
                    ]=new Set();

                }


                if(
                    subjectDays[
                        lesson.subject
                    ].has(d)
                ){

                    return false;

                }


                subjectDays[
                    lesson.subject
                ].add(d);

            }

        }


        for(
            const a of classData
        ){

            const actual =
                subjectDays[
                    a.subject
                ]
                ?
                subjectDays[
                    a.subject
                ].size
                :
                0;


            if(
                actual !==
                Number(a.periods)
            ){

                return false;

            }

        }

    }


    /*
     * TEACHER MAXIMUM 4 WORKING DAYS
     */

    for(
        const teacher of
        Object.keys(
            teacherDaySets
        )
    ){

        if(
            teacherDaySets[
                teacher
            ].size>4
        ){

            return false;

        }

    }


    return true;

}

                            getTeacherCode(

                                                code
                                            )}
                                        </span>

                                    </div>

                                </div>

                            </td>

                        `;

                    }
                    else{

                        html+=`

                            <td>

                                <span class="free">
                                    -
                                </span>

                            </td>

                        `;

                    }

                }
            );


            html+=`
                </tr>
            `;

        }

    }


    html+=`

                    </tbody>

                </table>

            </div>

            <div class="pdf-footer">
                Grade 12 Automatic Timetable
            </div>

        </div>

    `;


    result.innerHTML=
        html;

}


/* =========================================================
   DATE
   ========================================================= */

function getCurrentDate(){

    const now =
        new Date();


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    const month =
        String(
            now.getMonth()+1
        ).padStart(
            2,
            "0"
        );


    const year =
        now.getFullYear();


    return(
        day+
        "/"+
        month+
        "/"+
        year+
        " E.C."
    );

}


/* =========================================================
   EXCEL
   ========================================================= */

function exportExcel(){

    if(
        !timetable ||
        Object.keys(
            timetable
        ).length===0
    ){

        showMessage(
            "❌ መጀመሪያ Generate Timetable አድርግ።",
            "error"
        );

        return;

    }


    if(
        typeof XLSX==="undefined"
    ){

        showMessage(
            "❌ Excel library አልተጫነም። Internet አብራ።",
            "error"
        );

        return;

    }


    const workbook =
        XLSX.utils.book_new();


    const data=[];


    const header=[
        "Days",
        "Periods"
    ];


    classes.forEach(
        cls=>
            header.push(cls)
    );


    data.push(header);


    for(
        let d=0;
        d<5;
        d++
    ){

        for(
            let p=0;
            p<5;
            p++
        ){

            const row=[

                p===0
                ?
                days[d]
                :
                "",

                periodName(p)

            ];


            classes.forEach(
                cls=>{

                    const lesson =
                        timetable[
                            cls
                        ][d][p];


                    if(lesson){

                        const code =
                            getTeacherCode(
                                lesson.teacher
                            );


                        row.push(
                            lesson.subject+
                            " - "+
                            code
                        );

                    }
                    else{

                        row.push(
                            "Free"
                        );

                    }

                }
            );


            data.push(row);

        }

    }


    const worksheet =
        XLSX.utils.aoa_to_sheet(
            data
        );


    worksheet["!cols"]=[

        {
            wch:10
        },

        {
            wch:8
        }

    ];


    classes.forEach(
        ()=>{

            worksheet[
                "!cols"
            ].push({
                wch:24
            });

        }
    );


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Grade 12 Timetable"
    );


    const codeData=[

        [
            "Teacher Name",
            "Code"
        ]

    ];


    Object.entries(
        teacherCodes
    ).forEach(
        ([name,code])=>{

            codeData.push([
                name,
                code
            ]);

        }
    );


    const codeSheet =
        XLSX.utils.aoa_to_sheet(
            codeData
        );


    codeSheet["!cols"]=[

        {
            wch:30
        },

        {
            wch:15
        }

    ];


    XLSX.utils.book_append_sheet(
        workbook,
        codeSheet,
        "Teacher Codes"
    );


    try{

        XLSX.writeFile(
            workbook,
            "Grade_12_Timetable.xlsx"
        );


        showMessage(
            "✅ Excel file ተዘጋጅቷል።",
            "success"
        );

    }
    catch(error){

        console.error(error);


        showMessage(
            "❌ Excel file ማውጣት አልተቻለም።",
            "error"
        );

    }

}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );


    box.className =
        "message "+type;


    box.textContent =
        text;


    box.style.display =
        "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });


    if(
        type==="success"
    ){

        setTimeout(
            ()=>{

                box.style.display =
                    "none";

            },
            5000
        );

    }

}
